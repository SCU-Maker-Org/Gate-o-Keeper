version: 1
metadata:
  name: "Locker Backend OIDC Setup"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_core.group
    id: group-locker-admins
    state: present
    identifiers:
      name: "locker-admins"
    attrs:
      name: "locker-admins"
      is_superuser: false
      users:
        - !Find [authentik_core.user, [username, "akadmin"]]

  - model: authentik_core.group
    id: group-maker-members
    state: present
    identifiers:
      name: "maker-members"
    attrs:
      name: "maker-members"
      is_superuser: false

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-locker-oidc
    state: present
    identifiers:
      name: "locker-oidc"
    attrs:
      name: "locker-oidc"
      client_type: "confidential"
      grant_types:
        - "authorization_code"
        - "refresh_token"
      client_id: "locker-client-id"
      client_secret: "locker-client-secret"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      include_claims_in_id_token: true
      redirect_uris:
        - url: "http://localhost:8080/callback"
          matching_mode: "strict"
        - url: "http://127.0.0.1:8080/callback"
          matching_mode: "strict"
        - url: "^http://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?/.*$"
          matching_mode: "regex"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-entitlements"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-offline_access"]]
      logout_uri: "http://backend:8080/api/auth/backchannel-logout"
      logout_method: "backchannel"

  - model: authentik_core.application
    id: app-locker
    state: present
    identifiers:
      slug: "locker"
    attrs:
      name: "Smart Locker"
      slug: "locker"
      provider: !KeyOf provider-locker-oidc

  - model: authentik_core.group
    id: group-authentik-admins
    state: created
    identifiers:
      name: "authentik Admins"

  - model: authentik_events.notificationwebhookmapping
    id: mapping-locker-webhook-body
    state: present
    identifiers:
      name: "locker-webhook-body"
    attrs:
      name: "locker-webhook-body"
      expression: |
        ev = notification.event
        model = ev.context.get("model", {})
        return {
            "action": str(ev.action),
            "modelName": model.get("model_name", ""),
            "pk": model.get("pk"),
            "name": model.get("name"),
            "changes": ev.context.get("changes"),
        }

  - model: authentik_events.notificationwebhookmapping
    id: mapping-locker-webhook-headers
    state: present
    identifiers:
      name: "locker-webhook-headers"
    attrs:
      name: "locker-webhook-headers"
      expression: !Format
        - "return {'X-Authentik-Webhook-Secret': '%s'}"
        - !Env [AUTHENTIK_WEBHOOK_SECRET, ""]

  - model: authentik_events.notificationtransport
    id: transport-locker-webhook
    state: present
    identifiers:
      name: "locker-webhook-transport"
    attrs:
      name: "locker-webhook-transport"
      mode: "webhook"
      send_once: true
      webhook_url: "http://backend:8080/api/auth/authentik-webhook"
      webhook_mapping_body: !KeyOf mapping-locker-webhook-body
      webhook_mapping_headers: !KeyOf mapping-locker-webhook-headers

  - model: authentik_policies_event_matcher.eventmatcherpolicy
    id: policy-match-core-model-updated
    state: present
    identifiers:
      name: "locker-match-core-model-updated"
    attrs:
      name: "locker-match-core-model-updated"
      action: "model_updated"
      app: "authentik.core"

  - model: authentik_policies_event_matcher.eventmatcherpolicy
    id: policy-match-core-model-deleted
    state: present
    identifiers:
      name: "locker-match-core-model-deleted"
    attrs:
      name: "locker-match-core-model-deleted"
      action: "model_deleted"
      app: "authentik.core"

  - model: authentik_policies_event_matcher.eventmatcherpolicy
    id: policy-match-user-write
    state: present
    identifiers:
      name: "locker-match-user-write"
    attrs:
      name: "locker-match-user-write"
      action: "user_write"

  - model: authentik_policies_event_matcher.eventmatcherpolicy
    id: policy-match-user-offboarded
    state: present
    identifiers:
      name: "locker-match-user-offboarded"
    attrs:
      name: "locker-match-user-offboarded"
      action: "user_offboarded"

  - model: authentik_events.notificationrule
    id: rule-locker-user-sync
    state: present
    identifiers:
      name: "locker-user-sync-rule"
    attrs:
      name: "locker-user-sync-rule"
      severity: "notice"
      policy_engine_mode: "any"
      group: !KeyOf group-authentik-admins
      transports:
        - !KeyOf transport-locker-webhook

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 0
      policy: !KeyOf policy-match-core-model-updated
      target: !KeyOf rule-locker-user-sync

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 1
      policy: !KeyOf policy-match-core-model-deleted
      target: !KeyOf rule-locker-user-sync

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 2
      policy: !KeyOf policy-match-user-write
      target: !KeyOf rule-locker-user-sync

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 3
      policy: !KeyOf policy-match-user-offboarded
      target: !KeyOf rule-locker-user-sync
